<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
  display: block; /* 改成 block 而不是 flex */
  background: #060270;
  background-image: 
    linear-gradient(to top, rgba(6, 2, 112, 1) 20%, rgba(6, 2, 112, 0) 100%), 
    radial-gradient(circle, #030140 30px, transparent 30px), 
    radial-gradient(circle, #030140 30px, transparent 30px);
  background-size: 50px 50px, 100px 100px, 100px 100px;
  background-position: 0 100%, 0 0, 50px 50px;
  animation: move-dots 10s infinite linear;
  min-height: 100vh; /* 确保背景填满 */
}

      @keyframes move-dots {
        0% {
          background-position: 0 100%, 0 0, 50px 50px;
        }
        100% {
          background-position: 0 0, 0 0, 50px 50px;
        }
      }

      .header {
        color: blue;
        font-size: 48px;
        font-family: 'Press Start 2P', sans-serif;
        text-transform: uppercase;
        padding: 10px 20px;
        background: white; /* 让白色背景覆盖到字的后面 */
        border-radius: 8px;
        text-align: center;
      }

      iframe {
        width: 40vw;
        height: 660px;
        border: none;
        margin-top: 20px;
      }

      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    </style>
  </head>
  <body>
    <div class="header">Sketch</div>
    <iframe src="https://editor.p5js.org/xiaod701/full/R3REwT9HU"></iframe>
    <iframe src="https://editor.p5js.org/xiaod701/full/mrYZXYWou"></iframe>
    <div class="header">Final</div>
    <iframe src="https://editor.p5js.org/xiaod701/full/ZVIgaAQ-v"></iframe>
    <iframe src="https://editor.p5js.org/xiaod701/full/8t0MumD4oV"></iframe>
    <iframe src="https://editor.p5js.org/xiaod701/full/32AKob0lb"></iframe>
    <iframe src="https://editor.p5js.org/xiaod701/full/MasF-uA4w"></iframe>
  </body>
</html>
